services:
  opalop-api:
    container_name: opalop-api
    build:
      context: .
      dockerfile: src/Opalop.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__PostgreSQL=Host=opalop-db;Database=opalop;Username=opalop;Password=dev_password
      - ConnectionStrings__Redis=opalop-redis:6379
      - MinIO__Endpoint=opalop-minio:9000
      - Keycloak__Authority=http://opalop-keycloak:8080/realms/opalop
      - Keycloak__ValidIssuers__0=http://localhost:8080/realms/opalop
      - Keycloak__ValidIssuers__1=http://opalop-keycloak:8080/realms/opalop
    depends_on:
      opalop-redis:
        condition: service_started
      opalop-db:
        condition: service_healthy
      opalop-minio:
        condition: service_started
      opalop-keycloak:
        condition: service_started

  opalop-worker:
    build:
      context: .
      dockerfile: src/Opalop.Worker/Dockerfile
    environment:
      - ConnectionStrings__PostgreSQL=Host=opalop-db;Database=opalop;Username=opalop;Password=dev_password
      - ConnectionStrings__Redis=opalop-redis:6379
      - MinIO__Endpoint=opalop-minio:9000
    depends_on:
      opalop-redis:
        condition: service_started
      opalop-db:
        condition: service_healthy
      opalop-minio:
        condition: service_started
    deploy:
      replicas: 2

  opalop-redis:
    container_name: opalop-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis-data:/data

  opalop-db:
    container_name: opalop-db
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=opalop
      - POSTGRES_USER=opalop
      - POSTGRES_PASSWORD=dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opalop -d opalop"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  opalop-minio:
    container_name: opalop-minio
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  opalop-minio-init:
    container_name: opalop-minio-init
    image: minio/mc:latest
    depends_on:
      - opalop-minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://opalop-minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/photos;
      mc mb --ignore-existing local/resources;
      mc mb --ignore-existing local/mosaics;
      echo 'Buckets created successfully';
      exit 0;
      "

  opalop-keycloak:
    container_name: opalop-keycloak
    image: quay.io/keycloak/keycloak:24.0
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
    command: start-dev --import-realm
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import

volumes:
  redis-data:
  pgdata:
  minio-data:
